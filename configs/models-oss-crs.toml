# Model map for oss-crs mode — faithful mirror of models-final.toml.
# All models go through the LiteLLM proxy at OSS_CRS_LLM_API_URL.
# Provider prefixes (anthropic/, azure/) stripped since proxy handles routing.
# Provider-level fallbacks collapsed (e.g. azure/o4-mini + o4-mini → single entry).

AddDebugPrintsAgent = ["claude-sonnet-4-6"]
CRSDiffAgent = ["o4-mini"]
CRSDynamicDebugAgent = ["claude-sonnet-4-6"]
CRSPovProducerAgent = ["claude-sonnet-4-6", "claude-sonnet-4-6", "o3"]
HarnessInputEncoderAgent = ["o3"]
PatcherAgent = ["claude-sonnet-4-6", "gpt-4.1"]
SourceQuestionsAgent = ["o3"]
TriageAgent = ["o4-mini"]
DedupClassifier = ["gpt-4.1"]
FunctionSummarizer = ["claude-sonnet-4-6"]
LikelyVulnClassifier = ["gpt-4.1"]
CRSVulnAnalyzerAgent = ["o4-mini", "o4-mini", "o4-mini", "o4-mini"]
GenerateKaitaiAgent = ["claude-sonnet-4-6"]
HarnessInputDecoderAgent = ["claude-sonnet-4-6"]
BranchFlipperAgent = ["claude-sonnet-4-6"]
LikelyFlippableClassifier = ["gpt-4.1"]
FullModeMulti = ["claude-opus-4-6", "gemini-2.5-pro"]
FullMode = ["gpt-4o", "o3"]
