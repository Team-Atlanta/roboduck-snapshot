name: roboduck
type:
  - bug-finding
version: 1.0.0
docker_registry: local

prepare_phase:
  hcl: oss-crs/docker-bake.hcl

target_build_phase:
  - name: build
    dockerfile: oss-crs/dockerfiles/builder.Dockerfile
    outputs:
      - build
      - src

crs_run_phase:
  fuzzer:
    dockerfile: oss-crs/dockerfiles/runner.Dockerfile

supported_target:
  mode:
    - full
    - delta
  language:
    - c
    - c++
  sanitizer:
    - address
  architecture:
    - x86_64

required_llms:
  - claude-opus-4-20250514
  - claude-sonnet-4-20250514
  - claude-3-5-sonnet-20241022
  - o3-2025-04-16
  - o4-mini-2025-04-16
  - gpt-4.1-2025-04-14
  - gpt-4o-2024-08-06
  - gemini-2.5-pro
